                    <div id="verify-section" style="margin-top: 20px;">
                            <input type="text" id="aadhaar-input" placeholder="Enter 12-digit ID" maxlength="12" style="padding: 10px; width: 60%;">
                                    <button onclick="verifyID()" style="padding: 10px 20px; background-color: darkblue; color: white; border: none; cursor: pointer;">Verify</button>
                                            <p id="result-message" style="margin-top: 10px; font-weight: bold;"></p>
                                                </div>
                                                </div>

                                                <script>
                                                    function verifyID() {
                                                                const input = document.getElementById("aadhaar-input").value;
                                                                        const message = document.getElementById("result-message");

                                                                                // Simple mock logic: check if it is exactly 12 numbers
                                                                                        if (input.length === 12 && /^\d+$/.test(input)) {
                                                                                                        message.style.color = "green";
                                                                                                                    message.innerText = "✓ Verification Successful (Mock)";
                                                                                        } else {
                                                                                                        message.style.color = "red";
                                                                                                                    message.innerText = "✗ Invalid ID. Please enter 12 digits.";
                                                                                        }
                                                    }
                                                    </script>
                                                                                        }
                                                                                        }
                                                    }
