<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Profile Card</title>
                <style>
                        body {
                                    background-color: #223;
                                                display: flex;
                                                            justify-content: center;
                                                                        align-items: center;
                                                                                    height: 100vh;
                                                                                                margin: 0;
                                                                                                            font-family: sans-serif;
                                                                                                                    }

                                                                                                                            /* The gradient border effect */
                                                                                                                                    .card-wrapper {
                                                                                                                                                background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ff9a9e);
                                                                                                                                                            padding: 8px;
                                                                                                                                                                        border-radius: 20px;
                                                                                                                                                                                }

                                                                                                                                                                                        /* The white inner card */
                                                                                                                                                                                                .card {
                                                                                                                                                                                                            background: white;
                                                                                                                                                                                                                        padding: 30px;
                                                                                                                                                                                                                                    border-radius: 15px;
                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                            width: 250px;
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                            .avatar {
                                                                                                                                                                                                                                                                                        width: 80px;
                                                                                                                                                                                                                                                                                                    height: 80px;
                                                                                                                                                                                                                                                                                                                background-color: #ccc;
                                                                                                                                                                                                                                                                                                                            border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                        margin: 0 auto 15px;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                        h1 { margin: 0; color: #003366; font-size: 24px; }
                                                                                                                                                                                                                                                                                                                                                                p { color: #d6336c; margin: 5px 0 15px; font-weight: bold; }

                                                                                                                                                                                                                                                                                                                                                                        .skills { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
                                                                                                                                                                                                                                                                                                                                                                                .skill-pill { background: #ff4d6d; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; }

                                                                                                                                                                                                                                                                                                                                                                                        .contact-btn {
                                                                                                                                                                                                                                                                                                                                                                                                    background: #003366;
                                                                                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 10px 30px;
                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                display: inline-block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-wrapper">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="avatar"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>NAME</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>PROFESSION</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="skills">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="skill-pill">SKILL 1</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="skill-pill">SKILL 2</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="#" class="contact-btn">CONTACT</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
