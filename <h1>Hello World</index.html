<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Aadhaar Verification</title>
            <style>
                    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
                            .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
                                    input { padding: 10px; width: 200px; }
                                            button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
                                                </style>
                                                </head>
                                                <body>
                                                    <div class="container">
                                                            <h3>Aadhaar Verification</h3>
                                                                    <input type="text" id="aadhaarNum" placeholder="Enter 12-digit Aadhaar" maxlength="12">
                                                                            <button onclick="verifyAadhaar()">OK</button>
                                                                                </div>

                                                                                    <script>
                                                                                            function verifyAadhaar() {
                                                                                                        const num = document.getElementById('aadhaarNum').value;
                                                                                                                    if(num.length === 12) {
                                                                                                                                    // Navigates to the details page with the number as a query parameter
                                                                                                                                                    window.location.href = `details.html?aadhaar=${num}`;
                                                                                                                                                                } else {
                                                                                                                                                                                alert("Please enter a valid 12-digit number.");
                                                                                                                                                                                            }
                                                                                                                                                                                                    }
                                                                                                                                                                                                        </script>
                                                                                                                                                                                                        </body>
                                                                                                                                                                                                        </html>
